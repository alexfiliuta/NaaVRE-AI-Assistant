# Install in the http {} context only after replacing hostname and certificate paths.
# Ollama remains bound to 127.0.0.1:11434. Firewall this gateway to NaaVRE egress.
limit_conn_zone $ssl_client_fingerprint zone=ollama_clients:1m;
limit_conn_zone $server_name zone=ollama_gpu:1m;

server {
    listen 443 ssl;
    server_name REPLACE_WITH_INFERENCE_DNS_NAME;
    ssl_certificate /etc/naavre-tls/server-chain.pem;
    ssl_certificate_key /etc/naavre-tls/server-key.pem;
    ssl_client_certificate /etc/naavre-tls/client-ca.pem;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 2m;
    limit_conn ollama_clients 1;
    limit_conn ollama_gpu 2;
    limit_conn_status 429;

    location = /api/chat {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:11434;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_read_timeout 30m;
    }
    location = /api/tags {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:11434;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Authorization "";
    }
    # No pull/delete/upload APIs or unrestricted reverse proxy.
    location / { return 404; }
}
