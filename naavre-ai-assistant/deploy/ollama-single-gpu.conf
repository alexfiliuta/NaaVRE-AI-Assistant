# Optional systemd drop-in for nis07; review with the server administrator.
# Install under /etc/systemd/system/ollama.service.d/ only after review.
[Service]
Environment="OLLAMA_HOST=127.0.0.1:11434"
Environment="OLLAMA_NO_CLOUD=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NUM_PARALLEL=1"
